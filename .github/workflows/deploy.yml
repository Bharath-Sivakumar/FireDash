name: Release & Publish WebExtension

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump manifest version
        id: bump
        run: |
          CURRENT_VER=$(node -p "require('./manifest.json').version")
          NEW_VER=$(node -p "const v='$CURRENT_VER'.split('.'); while (v.length < 3) v.push('0'); v[2]=parseInt(v[2], 10)+1; v.join('.')")
          node -e "const m=require('./manifest.json'); m.version='$NEW_VER'; require('fs').writeFileSync('./manifest.json', JSON.stringify(m, null, 2));"
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "Updated manifest version to $NEW_VER"

      - name: Commit and push bumped manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Submit to Mozilla Add-ons (AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_SECRET }}
        run: |
          npx --yes web-ext sign \
            --channel listed \
            --artifacts-dir web-ext-artifacts \
            --ignore-files "README.md" "LICENSE*" ".github/**" "*.git*"